<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="white"/><g font-family="Arial" fill="black">
<text x="600" y="42" text-anchor="middle" font-size="28" font-weight="bold">Omni-Bot — WeMos D1 R32 + 2× TB6612FNG</text>
<rect x="50" y="90" width="280" height="310" fill="none" stroke="black" stroke-width="2"/><text x="190" y="125" text-anchor="middle" font-size="22" font-weight="bold">WeMos D1 R32</text>
<text x="70" y="165" font-size="16">GPIO13 → FL PWM</text><text x="70" y="195" font-size="16">GPIO18/19 → FL IN1/IN2</text>
<text x="70" y="230" font-size="16">GPIO14 → FR PWM</text><text x="70" y="260" font-size="16">GPIO21/22 → FR IN1/IN2</text><text x="70" y="300" font-size="16">GPIO32 → Driver A STBY</text>
<text x="70" y="335" font-size="16">GPIO16/23/25 → RL</text><text x="70" y="365" font-size="16">GPIO17/26/27 → RR</text>
<rect x="450" y="90" width="300" height="250" fill="none" stroke="black" stroke-width="2"/><text x="600" y="125" text-anchor="middle" font-size="22" font-weight="bold">TB6612FNG A</text>
<text x="470" y="170" font-size="16">Channel A → FL motor</text><text x="470" y="205" font-size="16">Channel B → FR motor</text><text x="470" y="245" font-size="16">VCC = 3.3V</text><text x="470" y="275" font-size="16">STBY = GPIO32</text><text x="470" y="305" font-size="16">VM = motor battery</text>
<rect x="850" y="90" width="300" height="250" fill="none" stroke="black" stroke-width="2"/><text x="1000" y="125" text-anchor="middle" font-size="22" font-weight="bold">TB6612FNG B</text>
<text x="870" y="170" font-size="16">Channel A → RL motor</text><text x="870" y="205" font-size="16">Channel B → RR motor</text><text x="870" y="245" font-size="16">VCC = 3.3V</text><text x="870" y="275" font-size="16">STBY = GPIO33</text><text x="870" y="305" font-size="16">VM = motor battery</text>
<rect x="420" y="475" width="360" height="150" fill="none" stroke="black" stroke-width="2"/><text x="600" y="515" text-anchor="middle" font-size="22" font-weight="bold">Motor battery</text>
<text x="445" y="555" font-size="17">+ → both TB6612 VM</text><text x="445" y="585" font-size="17">− → common GND</text><text x="445" y="615" font-size="17">ESP32 → suitable regulator/USB supply</text>
<text x="600" y="700" text-anchor="middle" font-size="16">VERIFY YOUR EXACT DRIVER BOARD, MOTOR CURRENT/VOLTAGE AND PIN LABELS BEFORE POWERING.</text>
</g></svg>